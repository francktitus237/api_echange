<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ForexPlatform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(15,23,42,.08); max-width: 420px; width: 100%; padding: 44px 40px; border: 1px solid #e2e8f0; }
        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 20px; color: #0f172a; text-decoration: none; margin-bottom: 32px; }
        .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #2563eb, #3b82f6); display: flex; align-items: center; justify-content: center; color: white; font-size: 15px; font-weight: 800; }
        h1 { color: #0f172a; margin-bottom: 6px; font-size: 24px; font-weight: 800; text-align: center; }
        p.subtitle { color: #64748b; margin-bottom: 30px; font-size: 14px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #334155; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; transition: border-color .15s, box-shadow .15s; }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        button { width: 100%; padding: 13px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; margin-top: 6px; }
        button:hover { background: #1d4ed8; }
        .link { text-align: center; margin-top: 22px; color: #64748b; font-size: 14px; }
        .link a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .link a:hover { text-decoration: underline; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px 14px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; }
        .divider { height: 1px; background: #e2e8f0; margin: 26px 0 0; }
    </style>
</head>
<body>
    <div class="box">
        <a class="brand" href="/"><span class="brand-mark">FX</span>ForexPlatform</a>
        <h1>Connexion</h1>
        <p class="subtitle">Accédez à votre espace client</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit">Se connecter</button>
        </form>

        <div class="divider"></div>
        <div class="link">
            Pas encore de compte ? <a href="/register/">Créer un compte</a>
        </div>
        <div class="link" style="margin-top:10px;">
            <a href="/">← Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
