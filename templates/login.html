<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ForexPlatform API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); max-width: 420px; width: 100%; padding: 40px; border: 1px solid #e2e8f0; }
        .brand { font-weight: 800; font-size: 20px; color: #2563eb; text-align: center; margin-bottom: 24px; }
        h1 { color: #1e293b; margin-bottom: 8px; font-size: 24px; }
        p.subtitle { color: #64748b; margin-bottom: 28px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #374151; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #2563eb; }
        button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .link { text-align: center; margin-top: 22px; color: #64748b; font-size: 14px; }
        .link a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .error { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">ForexPlatform</div>
        <h1>Connexion</h1>
        <p class="subtitle">Accédez à votre espace client</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>

        <div class="link">
            Pas encore de compte ? <a href="/register/">Créer un compte</a>
        </div>
        <div class="link" style="margin-top:12px;">
            <a href="/">Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
