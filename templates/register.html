<!DOCTYPE html>
<html lang="{{ lang|default:'fr' }}" dir="{{ dir|default:'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — ForexPlatform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: white; border-radius: 18px; box-shadow: 0 24px 60px rgba(2,6,23,.4); max-width: 480px; width: 100%; padding: 44px 40px; }
        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 20px; color: #0f172a; text-decoration: none; margin-bottom: 28px; }
        .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #2563eb, #3b82f6); display: flex; align-items: center; justify-content: center; color: white; font-size: 15px; font-weight: 800; }
        h1 { color: #0f172a; margin-bottom: 6px; font-size: 26px; font-weight: 800; text-align: center; }
        p.subtitle { color: #64748b; margin-bottom: 30px; font-size: 14px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #334155; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; transition: border-color .15s, box-shadow .15s; }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        button { width: 100%; padding: 13px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; margin-top: 6px; }
        button:hover { background: #1d4ed8; }
        .link { text-align: center; margin-top: 24px; color: #64748b; font-size: 14px; }
        .link a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px 14px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; }
        .perks { display: flex; gap: 14px; justify-content: center; margin-top: 22px; }
        .perk { font-size: 12px; color: #64748b; display: flex; align-items: center; gap: 6px; }
        .perk::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #16a34a; }
    </style>
</head>
<body>
    <div style="position:fixed;top:16px;inset-inline-end:20px;z-index:10;">{% include 'lang_select.html' %}</div>
    <div class="box">
        <a class="brand" href="/"><span class="brand-mark">FX</span>ForexPlatform</a>
        <h1>Créer votre compte</h1>
        <p class="subtitle">Clé API générée automatiquement après activation</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="password_confirm">Confirmer le mot de passe</label>
                <input type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit">Créer mon compte</button>
        </form>

        <div class="perks">
            <span class="perk">Plan gratuit</span>
            <span class="perk">Docs Swagger</span>
            <span class="perk">36 devises</span>
        </div>
        <div class="link">
            Déjà un compte ? <a href="/login/">Se connecter</a>
        </div>
    </div>
</body>
</html>
