services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=
      - USE_SQLITE=False
      - DB_NAME=forex_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - SETUP_SECRET=${SETUP_SECRET:-changeme123}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "cd /app && python manage.py migrate && gunicorn forex_platform.wsgi:application --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-4} --threads 2 --timeout 60 --max-requests 1000 --max-requests-jitter 100"

  celery_worker:
    build: .
    environment:
      - DATABASE_URL=
      - USE_SQLITE=False
      - DB_NAME=forex_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
      - rabbitmq
    restart: always
    command: sh -c "cd /app && celery -A forex_platform worker --loglevel=info"

  celery_beat:
    build: .
    environment:
      - DATABASE_URL=
      - USE_SQLITE=False
      - DB_NAME=forex_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
      - rabbitmq
    restart: always
    command: sh -c "cd /app && celery -A forex_platform beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: forex_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forex_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always

volumes:
  postgres_data:
