services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - default
      - dokploy-network
    restart: always

  app:
    build: .
    environment:
      - PORT=8000
      - USE_SQLITE=${USE_SQLITE:-False}
      - DB_NAME=${DB_NAME:-forex_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      # Production safety — never run with DEBUG or default secret
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-}
      - SITE_URL=${SITE_URL:-https://api-forexplatform.sendbid.app}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-api-forexplatform.sendbid.app,localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Payments — set in Dokploy env; empty = provider disabled
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_SANDBOX=${PAYPAL_SANDBOX:-False}
      # Forex providers (optional)
      - EXCHANGERATE_API_KEY=${EXCHANGERATE_API_KEY:-}
      - OPENEXCHANGERATES_APP_ID=${OPENEXCHANGERATES_APP_ID:-}
      - FIXER_API_KEY=${FIXER_API_KEY:-}
      # Email notifications (optional)
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@sendbid.app}
      # Auto-admin promotion
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
    depends_on:
      - redis
      - rabbitmq
    networks:
      - default
      - dokploy-network
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always

networks:
  dokploy-network:
    external: true
