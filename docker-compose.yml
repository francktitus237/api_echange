services:
  nginx:
    image: nginx:alpine
    # ports:
    #   - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - app
    restart: always

  app:
    build: .
    environment:
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    env_file:
      - .env
    volumes:
      - static_volume:/app/forex_platform/staticfiles
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-forex_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always

  celery_worker:
    build: .
    command: sh -c "cd /app/forex_platform && celery -A forex_platform worker --loglevel=info"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - db
      - redis
      - rabbitmq
    restart: always

  celery_beat:
    build: .
    command: sh -c "cd /app/forex_platform && celery -A forex_platform beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - db
      - redis
      - rabbitmq
    restart: always

  flower:
    build: .
    command: sh -c "cd /app/forex_platform && celery -A forex_platform flower --port=5555"
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - celery_worker
    restart: always

volumes:
  postgres_data:
  static_volume:
